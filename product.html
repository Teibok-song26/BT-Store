<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product | BT Store</title>

    <link rel="stylesheet" href="product.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header class="product-header">
      <a href="index.html" class="back-button"> ← Back to Store </a>

      <div class="product-logo">
        <img src="images/logo.jpg" alt="BT Store Logo" />
        <span>BT STORE</span>
      </div>
    </header>

    <!-- PRODUCT -->

    <main class="product-page">
      <div id="productContainer" class="product-container">
        <p class="loading">Loading product...</p>
      </div>
    </main>

    <!-- FOOTER -->

    <footer>
      <p>© 2026 BT Store. All rights reserved.</p>
    </footer>

    <script>
      const productContainer = document.getElementById("productContainer");

      // Get product ID from URL
      const urlParams = new URLSearchParams(window.location.search);

      const productId = urlParams.get("id");

      async function loadProduct() {
        if (!productId) {
          showError("Product was not specified.");

          return;
        }

        try {
          const response = await fetch("http://localhost:3000/api/products");

          const data = await response.json();

          if (!data.success) {
            throw new Error("Could not load products.");
          }

          const product = data.products.find((item) => item.id == productId);

          if (!product) {
            showError("Product not found.");

            return;
          }

          displayProduct(product);
        } catch (error) {
          console.error(error);

          showError("Unable to load this product.");
        }
      }

      function displayProduct(product) {
        document.title = `${product.name} | BT Store`;

        const price = new Intl.NumberFormat("en-IN", {
          style: "currency",
          currency: "INR",
          maximumFractionDigits: 0,
        }).format(product.price);

        productContainer.innerHTML = `

                <div class="product-image-section">

                    <img
                        src="http://localhost:3000${product.image}"
                        alt="${product.name}"
                    >

                </div>


                <div class="product-details">

                    <p class="product-label">
                        BT STORE PRODUCT
                    </p>

                    <h1>
                        ${product.name}
                    </h1>

                    <div class="price">
                        ${price}
                    </div>

                    <div class="divider"></div>

                    <h2>
                        Description
                    </h2>

                    <p class="description">
                        ${product.description}
                    </p>


                    <button
                        class="buy-button"
                        onclick="buyProduct(${product.id})"
                    >
                        BUY NOW
                    </button>

                </div>

            `;
      }

      function buyProduct(id) {
        window.location.href = `checkout.html?id=${id}`;
      }

      function showError(message) {
        productContainer.innerHTML = `

                <div class="error">

                    <h2>
                        ${message}
                    </h2>

                    <a href="index.html">
                        Return to BT Store
                    </a>

                </div>

            `;
      }

      loadProduct();
    </script>
  </body>
</html>
