<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product | BT Store</title>

    <link rel="stylesheet" href="product.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header class="product-header">
      <a href="index.html" class="back-button"> ← Back to Store </a>

      <div class="product-logo">
        <img src="images/logo.jpg" alt="BT Store Logo" />

        <span>BT STORE</span>
      </div>
    </header>

    <!-- PRODUCT -->

    <main class="product-page">
      <div id="productContainer" class="product-container">
        <p class="loading">Loading product...</p>
      </div>
    </main>

    <!-- FOOTER -->

    <footer>
      <p>© 2026 BT Store. All rights reserved.</p>
    </footer>

    <script>
      // ============================
      // Backend URL
      // ============================

      const API_URL = "https://bt-store.onrender.com";

      // ============================
      // Product Container
      // ============================

      const productContainer = document.getElementById("productContainer");

      // ============================
      // Get Product ID
      // ============================

      const urlParams = new URLSearchParams(window.location.search);

      const productId = urlParams.get("id");

      // ============================
      // Load Product
      // ============================

      async function loadProduct() {
        if (!productId) {
          showError("Product was not specified.");

          return;
        }

        try {
          console.log("Loading product:", productId);

          const response = await fetch(`${API_URL}/api/products`);

          if (!response.ok) {
            throw new Error(`Server returned ${response.status}`);
          }

          const data = await response.json();

          console.log("Products response:", data);

          if (!data.success || !Array.isArray(data.products)) {
            throw new Error("Invalid products response.");
          }

          const product = data.products.find(
            (item) => Number(item.id) === Number(productId),
          );

          if (!product) {
            showError("Product not found.");

            return;
          }

          displayProduct(product);
        } catch (error) {
          console.error("PRODUCT LOAD ERROR:", error);

          showError("Unable to load this product.");
        }
      }

      // ============================
      // Display Product
      // ============================

      function displayProduct(product) {
        document.title = `${product.name} | BT Store`;

        const price = new Intl.NumberFormat("en-IN", {
          style: "currency",
          currency: "INR",
          maximumFractionDigits: 0,
        }).format(product.price);

        const imageURL = `${API_URL}${product.image}`;

        productContainer.innerHTML = `
          <div class="product-image-section">

            <img
              src="${imageURL}"
              alt="${escapeHTML(product.name)}"
              onerror="this.style.display='none'"
            />

          </div>

          <div class="product-details">

            <p class="product-label">
              BT STORE PRODUCT
            </p>

            <h1>
              ${escapeHTML(product.name)}
            </h1>

            <div class="price">
              ${price}
            </div>

            <div class="divider"></div>

            <h2>
              Description
            </h2>

            <p class="description">
              ${escapeHTML(product.description)}
            </p>

            <button
              class="buy-button"
              type="button"
              onclick="buyProduct(${Number(product.id)})"
            >
              BUY NOW
            </button>

          </div>
        `;
      }

      // ============================
      // Buy Product
      // ============================

      function buyProduct(id) {
        window.location.href = `checkout.html?id=${id}`;
      }

      // ============================
      // Show Error
      // ============================

      function showError(text) {
        productContainer.innerHTML = `
          <div class="error">

            <h2>
              ${escapeHTML(text)}
            </h2>

            <a href="index.html">
              Return to BT Store
            </a>

          </div>
        `;
      }

      // ============================
      // HTML Escape
      // ============================

      function escapeHTML(value) {
        const div = document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;
      }

      // ============================
      // Start
      // ============================

      loadProduct();
    </script>
  </body>
</html>
